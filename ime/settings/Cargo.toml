[package]
name = "lufly-settings"
# 与安装器 VER 保持一致（关于页经 CARGO_PKG_VERSION 展示）
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "小鹭音形输入法 设置（WebView2 壳，独立进程——TIP DLL 不承载 UI）"

[[bin]]
name = "lufly-settings"
path = "src/main.rs"

[dependencies]
rfd = "0.17.2"
serde_json = "1"
tao = "0.37.1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57.0"

[build-dependencies]
winresource = "0.1.34"
