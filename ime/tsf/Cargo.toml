[package]
name = "lufly-tsf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "小鹭音形 Windows TSF 输入法（COM DLL）"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
winresource = "0.1"

[dependencies]
lufly-engine = { path = "../engine" }
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
]
